quarkus.application.name=agendaflow-notification-service
quarkus.http.port=8081
%test.quarkus.http.test-port=0

notification.provider=${NOTIFICATION_PROVIDER:not-configured}
notification.email-sender=${EMAIL_FROM:no-reply@example.com}
notification.spring-api-base-url=${SPRING_API_BASE_URL:http://localhost:8080}

# Service-to-service JWT verification. A real secret is required outside the test profile.
service.jwt.secret=${SERVICE_JWT_SECRET}
service.jwt.issuer=${SERVICE_JWT_ISSUER:agendaflow-api}
service.jwt.audience=${SERVICE_JWT_AUDIENCE:agendaflow-notification-service}
smallrye.jwt.verify.secretkey=${service.jwt.secret}
smallrye.jwt.verify.algorithm=HS256
smallrye.jwt.required.claims=sub,exp
mp.jwt.verify.issuer=${service.jwt.issuer}
mp.jwt.verify.audiences=${service.jwt.audience}
mp.jwt.verify.clock.skew=1

%test.service.jwt.secret=test-only-agendaflow-service-jwt-secret-32-bytes-minimum
# Test-only HMAC JWK prevents Quarkus from auto-generating an unrelated RSA key pair.
%test.mp.jwt.verify.publickey={"kty":"oct","kid":"test-service-key","alg":"HS256","k":"dGVzdC1vbmx5LWFnZW5kYWZsb3ctc2VydmljZS1qd3Qtc2VjcmV0LTMyLWJ5dGVzLW1pbmltdW0"}

quarkus.log.level=INFO
quarkus.log.category."com.flakomencia.agendaflow.notification".level=INFO
quarkus.log.category."quarkus-mailer".level=WARN
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) correlationId=%X{correlationId} %s%e%n

# Keep the validation contract strict: fields such as secrets, attachments or raw HTML payloads are not accepted.
quarkus.jackson.fail-on-unknown-properties=true

# Notification Service owns only the notification_service schema.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/agendaflow_notifications}
%prod.quarkus.datasource.username=${NOTIFICATION_DB_USERNAME:agendaflow_notification_user}
%prod.quarkus.datasource.password=${NOTIFICATION_DB_PASSWORD:change-me}
%dev.quarkus.datasource.jdbc.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/agendaflow_notifications}
%dev.quarkus.datasource.username=${NOTIFICATION_DB_USERNAME:agendaflow_notification_user}
%dev.quarkus.datasource.password=${NOTIFICATION_DB_PASSWORD:change-me}
quarkus.hibernate-orm.database.default-schema=notification_service
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.create-schemas=true
quarkus.flyway.default-schema=notification_service
quarkus.flyway.schemas=notification_service
quarkus.flyway.locations=db/migration
quarkus.datasource.health.enabled=true

# Testcontainers is supplied by Quarkus Dev Services; no H2 or local PostgreSQL is used in tests.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:18.4
%test.quarkus.datasource.devservices.db-name=notification_service_test
%test.quarkus.datasource.devservices.username=notification_test
%test.quarkus.datasource.devservices.password=notification_test

notification.inbox.enabled=${NOTIFICATION_INBOX_ENABLED:true}
notification.inbox.poll-interval=${NOTIFICATION_INBOX_POLL_INTERVAL:5s}
notification.inbox.batch-size=${NOTIFICATION_INBOX_BATCH_SIZE:20}
notification.inbox.max-attempts=${NOTIFICATION_INBOX_MAX_ATTEMPTS:5}
notification.inbox.initial-delay=${NOTIFICATION_INBOX_INITIAL_DELAY:10s}
notification.inbox.max-delay=${NOTIFICATION_INBOX_MAX_DELAY:1h}
notification.inbox.processing-timeout=${NOTIFICATION_INBOX_PROCESSING_TIMEOUT:5m}
%test.notification.inbox.enabled=false

# Quarkus Mailer is mocked in dev/test. Production obtains SMTP settings only from the environment.
quarkus.mailer.from=${EMAIL_FROM:no-reply@example.com}
%prod.quarkus.mailer.host=${SMTP_HOST:localhost}
%prod.quarkus.mailer.port=${SMTP_PORT:25}
%prod.quarkus.mailer.username=${SMTP_USERNAME:}
%prod.quarkus.mailer.password=${SMTP_PASSWORD:}
%prod.quarkus.mailer.mock=false
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
